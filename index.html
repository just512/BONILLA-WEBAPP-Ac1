<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JUST BURGER — Big Flavor. No Compromise.</title>
    <meta
      name="description"
      content="JUST BURGER — Big Flavor. No Compromise. Online burger ordering, custom meal builder, real-time kitchen display, and restaurant management platform."
    />
    <meta property="og:title" content="JUST BURGER — Big Flavor. No Compromise." />
    <meta
      property="og:description"
      content="Fresh cravings, bold flavors, and satisfying bites. Customize burgers, build combos, order pickup or delivery, and track in real time."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('jb_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white text-[#171717] dark:bg-[#0F0F0F] dark:text-neutral-100 antialiased selection:bg-[#D62828] selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
